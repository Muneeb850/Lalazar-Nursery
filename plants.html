<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plants — Lalazar Nursery</title>
<meta name="description" content="Shop indoor plants, succulents, flowering plants, outdoor greenery and garden supplies from Lalazar Nursery.">
<meta name="theme-color" content="#06110b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306110b'/%3E%3Cpath d='M14 50C14 27 28 13 52 11c-1 23-12 39-34 41M14 50c9-12 18-22 28-31' fill='none' stroke='%23c9f26b' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
<main>
  <section class="phero">
    <span class="eyebrow" style="color:var(--lime)">The collection</span>
    <h1 class="display" style="margin-top:22px" data-split data-hero>Plants for <em>every</em> corner.</h1>
    <p class="lead hero-in">Filter by type, search by name, and tap any plant for care details.</p>
  </section>

  <div class="light">
    <div class="shop-bar">
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
      <div class="tools">
        <input class="field" id="q" type="search" placeholder="Search plants…" aria-label="Search plants">
        <select class="field" id="sort" aria-label="Sort">
          <option value="feat">Featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="az">Name A–Z</option>
        </select>
      </div>
    </div>
    <p class="count wrap" style="padding-top:26px" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/data.js?v=14"></script>
<script src="js/main.js?v=14"></script>
<script src="js/plants.js?v=14"></script>
</body>
</html>
